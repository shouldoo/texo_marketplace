name: checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
    tags: ["*-v*"]

permissions:
  contents: read

env:
  # the core whose contract and checks the packs follow (texo_core is public)
  TEXO_CORE_REF: v2.1.1

jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shouldoo/texo_core
          ref: ${{ env.TEXO_CORE_REF }}
          path: .core
      - name: Isolation (the list of names comes from the secret of the organisation)
        env:
          ISOLATION_PATTERNS: ${{ secrets.ISOLATION_PATTERNS }}
        run: python3 .core/scripts/check_isolation.py --root .
      - name: Independent from any one assistant, skills structure
        run: |
          python3 .core/scripts/check_agents.py --root .
          for pack in packs/*/; do
            python3 .core/scripts/check_agents.py --root "$pack"
            python3 .core/scripts/check_skills.py --root "$pack"
          done
      - name: Manifests, seeds, skills and references of every pack
        env:
          TEXO_CORE: .core
        run: python3 -m unittest discover -s tests -v
      - name: The tests of the packs (demo data, scripts)
        env:
          TEXO_CORE: ${{ github.workspace }}/.core
        run: |
          for tests in packs/*/tests; do
            python3 -m unittest discover -s "$tests" -v
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: shellcheck -S warning packs/*/scripts/*.sh
      - name: Python
        run: pipx run ruff==0.17.0 check tests packs

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: shouldoo/texo_core
          ref: ${{ env.TEXO_CORE_REF }}
          path: .core
      - name: No assistant named as author in the commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then range="$PR_BASE..$PR_HEAD"; else range="$PUSH_BEFORE..$PUSH_AFTER"; fi
          if [ "$EVENT" != pull_request ] && ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_AFTER"
          fi
          python3 .core/scripts/check_attribution.py --range "$range"
      - name: No assistant named as author in the description of the pull request
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .core/scripts/check_attribution.py --env PR_BODY

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --config /repo/.gitleaks.toml --redact -v
