# Il seed del pacchetto partner Odoo nel hub (core: texo seed, route admin/seed). Ogni voce ha un code o una key
# stabile: una nuova versione del seed aggiorna ciò che un lead non ha cambiato e tiene ciò che un lead ha cambiato.
lang = "it_IT"

[[activities]]
code = "code"
name = "Codice"
sequence = 30
description = "Scrivere, revisionare o testare codice: moduli, script, configurazione in un repository."

[[activities]]
code = "deploy"
name = "Deploy e ambienti"
sequence = 40
description = "Istanze, database, server e rilasci: locale, stage e produzione."

[[activities]]
code = "data"
name = "Dati del cliente"
sequence = 50
description = "Leggere, copiare, importare o convertire i dati e i documenti di un cliente."

[[activities]]
code = "migration"
name = "Migrazione"
sequence = 60
description = "Portare un'istanza o un modulo a un'altra versione di Odoo."

[[rules]]
key = "production_never_a_test"
name = "La produzione non è mai un bersaglio di test"
severity = "never"
activities = ["deploy", "data"]
section = "operations"
keywords = "produzione, production, test, stage, collaudo"
body = "Non scrivere mai su un database o un URL di produzione, non aggiornarvi moduli e non eseguirvi test: le modifiche arrivano in produzione con il rilascio del progetto, dopo lo stage e il collaudo del cliente."

[[rules]]
key = "copies_neutralised"
name = "Una copia di produzione si neutralizza prima"
severity = "never"
activities = ["data", "deploy"]
section = "compliance"
keywords = "neutralizzazione, anonimizzazione, copia di produzione, neutralize, anonymize"
body = "Non avviare mai un'istanza su una copia di un database di produzione prima di averla neutralizzata (lo script neutralize-db.sh del pacchetto odoo_partner); per un'organizzazione che serve persone vulnerabili, anonimizzala anche (anonymize-db.sh)."

[[rules]]
key = "names_from_the_source"
name = "Nomi controllati nel sorgente della versione"
severity = "must"
activities = ["code", "migration"]
section = "operations"
keywords = "campo, metodo, vista, nome, sorgente, field, method, view, source"
body = "Prima di usare un campo, un metodo, una vista o un xmlid, trovalo nel sorgente della versione Odoo dell'istanza (il filo odoo-<NN>) o del modulo OCA; un nome a memoria è un'ipotesi."

[[rules]]
key = "tests_with_a_clean_log"
name = "Test e log pulito dopo ogni modifica"
severity = "must"
activities = ["code"]
section = "operations"
keywords = "test, checklog, warning, avviso, log, modulo, module"
body = "Dopo aver creato o modificato un modulo, esegui i suoi test su un database creato per il task e controlla il log con checklog-odoo: un warning fa fallire la modifica come un test fallito."

[[rules]]
key = "database_through_the_orm"
name = "Database attraverso l'ORM"
severity = "prefer"
activities = ["code", "data"]
section = "operations"
keywords = "odoo shell, ORM, SQL, database, query, interrogazione"
body = "Leggi e modifica un database Odoo con odoo shell e l'ORM, così si applicano regole di accesso, campi calcolati e vincoli; SQL diretto solo quando l'ORM non può farlo, dicendo perché."

[[rules]]
key = "dependency_installed"
name = "Una dipendenza solo da un modulo installato"
severity = "must"
activities = ["code"]
section = "operations"
keywords = "dipendenza, depends, modulo installato, dependency"
body = "Proponi una dipendenza da un modulo solo quando la description del progetto lo elenca come installato sull'istanza; altrimenti dillo e chiedi."

[[project_templates]]
key = "odoo_project"
name = "Progetto Odoo (template)"
description = "<p>Le fasi di un nuovo progetto Odoo Community, dall'analisi all'assistenza dopo l'avvio in produzione.</p>"
tasks = [
    {name = "Analisi dei processi", description = "<p>I processi del cliente, gli scostamenti dallo standard e i moduli OCA che li coprono.</p>"},
    {name = "Istanza e repository", description = "<p>Il repository dell'istanza, i suoi submodule, gli ambienti locale e di stage.</p>"},
    {name = "Configurazione e sviluppo", description = "<p>Prima la configurazione, poi i moduli custom, ciascuno con i suoi test.</p>"},
    {name = "Collaudo sullo stage", description = "<p>Il cliente prova sullo stage con utenti che ricalcano i ruoli reali.</p>"},
    {name = "Avvio in produzione", description = "<p>Importazione dei dati, rilascio in produzione, controlli del primo giorno.</p>"},
    {name = "Assistenza dopo l'avvio"},
]

[[project_templates]]
key = "odoo_migration"
name = "Migrazione di versione Odoo (template)"
description = "<p>Portare un'istanza a una nuova versione di Odoo: analisi, moduli, database, collaudo, produzione.</p>"
tasks = [
    {name = "Analisi", description = "<p>Moduli installati, i loro branch di destinazione, le dipendenze OCA, i cambi di versione che li toccano.</p>"},
    {name = "Moduli custom sulla versione di destinazione"},
    {name = "Migrazione di prova del database", description = "<p>Su una copia neutralizzata, con il log dell'aggiornamento pulito.</p>"},
    {name = "Collaudo del cliente"},
    {name = "Migrazione in produzione"},
]
