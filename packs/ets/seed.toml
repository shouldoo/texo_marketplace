# Il seed del pacchetto ETS nel hub (core: texo seed, route admin/seed). Ogni voce ha un code o una key stabile:
# una nuova versione del seed aggiorna ciò che un lead non ha cambiato e tiene ciò che un lead ha cambiato.
lang = "it_IT"

[[activities]]
code = "funding"
name = "Finanziamenti"
sequence = 30
description = "Avvisi e bandi di finanziamento, domande, convenzioni con finanziatori e donatori."

[[activities]]
code = "reporting"
name = "Rendicontazione"
sequence = 40
description = "La rendicontazione ai finanziatori e al registro: cifre, documenti, bilanci e rendiconti."

[[activities]]
code = "volunteers"
name = "Volontari e associati"
sequence = 50
description = "Associati, volontari e personale: registri, assicurazione, rimborsi, assemblee."

[[activities]]
code = "services"
name = "Servizi alle persone"
sequence = 60
description = "I servizi che l'organizzazione svolge per le persone che serve: l'attività con le regole più severe."

[[sections]]
code = "governance"
name = "Governance"
sequence = 60
description = "Statuto, organi e loro mandati, assemblee degli associati, il registro del Terzo settore."

[[rules]]
key = "no_data_of_people_served"
name = "Nessun dato delle persone servite"
severity = "never"
activities = ["services", "communication", "reporting"]
section = "compliance"
keywords = "beneficiari, utenti, persone accolte, persone servite, dati personali, privacy, beneficiaries"
body = "Non scrivere mai dati delle persone che l'organizzazione serve (nomi, storie, situazioni, contatti, neppure in un esempio inventato) nella memoria, in git, in una conversazione o in un documento che redigi: descrivi il lavoro con attività, numeri aggregati ed esiti."

[[rules]]
key = "protected_addresses"
name = "Gli indirizzi protetti non si scrivono mai"
severity = "never"
activities = []
section = "compliance"
keywords = "indirizzo, struttura protetta, casa rifugio, accoglienza, address, shelter"
body = "Non scrivere mai da nessuna parte l'indirizzo di una struttura protetta: né nella memoria, né in un progetto, né in un testo per il pubblico."

[[rules]]
key = "communication_never_identifies"
name = "La comunicazione non identifica mai una persona"
severity = "never"
activities = ["communication"]
section = "operations"
keywords = "comunicazione, comunicato, social, report pubblico, anonimato, riconoscibile"
body = "Un testo sui servizi (report, post, comunicato stampa, appello per volontari) non rende mai riconoscibile una persona servita, né direttamente né per la combinazione di luogo, periodo, servizio e numeri piccoli."

[[rules]]
key = "registry_deadlines_tracked"
name = "Le scadenze del registro e dei contributi sono task"
severity = "must"
activities = ["reporting", "funding"]
section = "governance"
keywords = "RUNTS, scadenza, deposito, bilancio, rendiconto, contributo, deadline"
body = "Ogni scadenza del registro del Terzo settore e di ogni contributo è un task del hub con la sua data, aperto appena la scadenza è nota."

[[rules]]
key = "figures_from_accounting"
name = "Le cifre vengono dalla contabilità"
severity = "must"
activities = ["reporting", "funding"]
section = "operations"
keywords = "cifre, importi, piano dei costi, rendicontazione, contabilità, contabilita, figures"
body = "Le cifre di una domanda, di un rendiconto o di un bilancio vengono dalla contabilità e dai documenti dell'organizzazione, mai stimate o arrotondate per farle tornare; una cifra che manca si chiede alla persona."

[[rules]]
key = "cite_the_article"
name = "Un obbligo cita l'articolo vigente"
severity = "must"
activities = ["analysis", "reporting", "funding"]
section = "compliance"
keywords = "norma, articolo, legge, decreto, citazione, testo vigente, Codice del Terzo settore"
body = "Una risposta su un obbligo di legge cita l'atto e l'articolo letti nel testo vigente; un reference del pacchetto è una mappa, non sostituisce il testo."

[[rules]]
key = "person_submits"
name = "Presenta la persona"
severity = "never"
activities = ["funding", "reporting"]
section = "operations"
keywords = "invio, firma, presentazione, PEC, piattaforma, deposito, submit"
body = "Non firmare, presentare o inviare mai una domanda, una dichiarazione, un rendiconto o un deposito al registro: l'agente prepara e controlla, la persona firma e presenta."

[[project_templates]]
key = "grant_application"
name = "Domanda di finanziamento (template)"
description = "<p>Da un avviso di finanziamento alla presentazione della domanda.</p>"
tasks = [
    {name = "Scheda dell'avviso", description = "<p>Finanziatore, obiettivi, soggetti e attività ammissibili, dotazione, scadenza, criteri, cause di esclusione, ciascuno con il suo articolo.</p>"},
    {name = "Decisione di partecipare", description = "<p>Requisiti controllati sui fatti dell'organizzazione; chi ha deciso e perché.</p>"},
    {name = "Partner e accordi"},
    {name = "Proposta progettuale", description = "<p>Sui capitoli dell'avviso e sui suoi criteri, nell'ordine del loro peso.</p>"},
    {name = "Piano dei costi", description = "<p>Voci ammissibili, cifre dalla persona o dalla contabilità, cofinanziamento.</p>"},
    {name = "Dichiarazioni e firme"},
    {name = "Controllo finale e presentazione da parte della persona"},
]

[[project_templates]]
key = "funded_project"
name = "Progetto finanziato (template)"
description = "<p>Un progetto finanziato da un avviso: dalla convenzione al rendiconto finale.</p>"
tasks = [
    {name = "Convenzione e regole del finanziatore", description = "<p>Periodo di ammissibilità, costi ammissibili, cofinanziamento, regole sul personale, variazioni del piano dei costi, pubblicità, scadenze.</p>"},
    {name = "Avvio"},
    {name = "Attività"},
    {name = "Rendiconto intermedio"},
    {name = "Rendiconto finale", description = "<p>Attività, risultati e indicatori in forma aggregata; il rendiconto economico controllato sulla contabilità.</p>"},
    {name = "Chiusura e lezioni"},
]
