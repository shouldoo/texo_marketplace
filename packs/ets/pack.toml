# Il contratto di questo pacchetto con la CLI texo (texo/packs.py del core).
[pack]
name = "ets"
version = "v1.2.0"
core = ">=2.0, <3"
hub = ">=20.0.1.0.0"
work_dirs = []

# I fili che questo pacchetto suggerisce: texo mount dice quali mancano. L'organizzazione sceglie il fornitore
# di ciascuno e lo dichiara nei fili del hub con il suo driver, l'indirizzo e la versione fissata (docs/fili.md del core).
[[suggested_thread]]
id = "normativa"
why = "i testi delle leggi e dei decreti che il settore applica: il Codice del Terzo settore, i decreti sul registro e sui bilanci"
type = "source"
data_class = "public"
guide = "Prima di rispondere su un obbligo: cerca l'atto, leggi l'articolo vigente, citalo con atto e articolo."

[[suggested_thread]]
id = "bandi"
why = "i canali dove si pubblicano gli avvisi di finanziamento a cui l'organizzazione può partecipare"
type = "source"
data_class = "public"
guide = "Avvisi di finanziamento: segui i canali come fonti esterne del hub (hub_channel), non presentare mai una domanda senza la persona."

[[suggested_thread]]
id = "documenti"
why = "l'archivio dove l'organizzazione tiene i suoi documenti: statuto, verbali, domande, rendiconti"
type = "connector"
data_class = "customer"
guide = "Leggi i documenti che servono al lavoro, non copiarli mai in locale; un documento sulle persone servite non si legge mai."
