# Il seed del pacchetto della lista civica nel hub (core: texo seed, route admin/seed). Ogni voce ha un code o una
# key stabile: una nuova versione del seed aggiorna ciò che un lead non ha cambiato e tiene ciò che un lead ha cambiato.
lang = "it_IT"

[[activities]]
code = "campaign"
name = "Campagna"
sequence = 30
description = "Eventi, banchetti, incontri e i volontari che li animano."

[[activities]]
code = "press"
name = "Stampa e social"
sequence = 40
description = "Comunicati stampa, la rassegna stampa, post e messaggi per gli account social della lista."

[[activities]]
code = "programme"
name = "Programma"
sequence = 50
description = "Il programma della lista, costruito in gruppi tematici."

[[activities]]
code = "election"
name = "Procedimento elettorale"
sequence = 60
description = "Candidature, firme, il mandatario elettorale, le spese della campagna e il loro rendiconto."

[[rules]]
key = "no_invented_positions"
name = "Nessuna posizione, citazione o evento inventati"
severity = "never"
activities = ["press", "communication", "programme"]
section = "operations"
keywords = "citazione, posizione, dichiarazione, virgolettato, quote, statement"
body = "Non inventare mai una posizione, una dichiarazione, una citazione o un evento di una persona, un partito, una lista o un ente reali; una citazione va tra virgolette solo come la dà la persona, parola per parola."

[[rules]]
key = "drafts_only"
name = "Solo bozze: pubblica e invia una persona"
severity = "never"
activities = ["press", "campaign", "communication"]
section = "operations"
keywords = "pubblicare, inviare, post, comunicato, bozza, publish, send"
body = "Non pubblicare, postare, inviare, mandare per e-mail o programmare mai nulla rivolto alla stampa, agli account social, agli elettori o ad altre liste: prepara la bozza, una persona la legge e la invia."

[[rules]]
key = "people_data_in_the_hub"
name = "Dati di elettori e sostenitori solo nel hub"
severity = "never"
activities = []
section = "compliance"
keywords = "privacy, sostenitori, firmatari, volontari, elettori, donatori, contatti, dati personali"
body = "I dati personali di elettori, sostenitori, firmatari, volontari e donatori restano nel hub: mai in un file, in una chat o in un messaggio a un filo che non li ammette; un elenco di sostenitori rivela opinioni politiche."

[[rules]]
key = "facts_with_source"
name = "Fatti su altri con la loro fonte e la loro data"
severity = "must"
activities = ["press", "communication", "programme"]
section = "operations"
keywords = "fonte, data, rassegna, scheda, attribuzione, source"
body = "Scrivi un fatto su altri (un voto, un atto, una dichiarazione, una cifra) solo con la sua fonte pubblica e la sua data; ciò che altri sostengono si attribuisce, mai presentato come un fatto."

[[rules]]
key = "silence_period"
name = "Il silenzio elettorale in ogni bozza"
severity = "must"
activities = ["press", "campaign"]
section = "compliance"
keywords = "silenzio elettorale, giorno prima del voto, propaganda, comizio, sondaggi"
body = "Non pianificare comizi, riunioni di propaganda pubblica o nuovi manifesti per il giorno prima e i giorni del voto, né risultati di sondaggi nei quindici giorni prima del voto: controlla le date sul decreto che indice le elezioni."

[[rules]]
key = "spending_with_document"
name = "Ogni spesa con il suo documento"
severity = "must"
activities = ["election", "campaign"]
section = "compliance"
keywords = "spese, rendiconto, fattura, ricevuta, mandatario, contributi, spending"
body = "Registra ogni spesa e ogni contributo della campagna come fatto con il suo documento allegato (fattura, ricevuta, estratto conto), così il rendiconto delle spese si scrive dalla memoria."

[[project_templates]]
key = "municipal_campaign"
name = "Campagna per le comunali (template)"
description = "<p>La campagna di una lista civica per un'elezione comunale, dal programma al giorno dopo il voto.</p>"
tasks = [
    {name = "Programma in gruppi tematici", description = "<p>I gruppi, le loro bozze, l'assemblea che approva il programma.</p>"},
    {name = "Candidati e lista", description = "<p>Chi si candida, le accettazioni, il contrassegno, le regole di genere della tornata.</p>"},
    {name = "Raccolta firme", description = "<p>Vedi il template della raccolta firme.</p>"},
    {name = "Eventi e banchetti", description = "<p>Calendario, permessi, volontari, materiali con il committente responsabile.</p>"},
    {name = "Stampa e social", description = "<p>Rassegna stampa, comunicati, post: bozze approvate dal responsabile.</p>"},
    {name = "Spese e rendiconto", description = "<p>Il mandatario elettorale, il conto, ogni spesa con il suo documento, il rendiconto.</p>"},
    {name = "Giorno del voto e risultati"},
]

[[project_templates]]
key = "signature_collection"
name = "Raccolta firme (template)"
description = "<p>Raccogliere e controllare le firme che presentano la lista, entro le date della tornata.</p>"
tasks = [
    {name = "Istruzioni della tornata", description = "<p>Date, fascia di popolazione, numero minimo e massimo di firme, moduli.</p>"},
    {name = "Moduli e autenticatori", description = "<p>I moduli della tornata, chi autentica e quando.</p>"},
    {name = "Banchetti di raccolta"},
    {name = "Certificati elettorali", description = "<p>Certificati dei firmatari e dei candidati dal comune.</p>"},
    {name = "Controllo delle firme", description = "<p>Firme valide contate, firme non valide spiegate.</p>"},
    {name = "Presentazione"},
]
