# Il contratto di questo pacchetto con la CLI texo (texo/packs.py del core).
[pack]
name = "lista_civica"
version = "v1.2.0"
core = ">=2.0, <3"
hub = ">=20.0.1.0.0"
work_dirs = []

# I fili che questo pacchetto suggerisce: texo mount dice quali mancano. Ogni cliente dichiara i suoi nella lista
# [[thread]] dei fili del hub, con il driver, l'indirizzo e il ref del fornitore che sceglie.
[[suggested_thread]]
id = "normativa"
why = "la legge elettorale e le regole della comunicazione politica, lette e citate articolo per articolo"
type = "source"
data_class = "public"
guide = "Legge elettorale, propaganda, par condicio, spese elettorali: cerca l'atto, leggi l'articolo vigente, citalo."

[[suggested_thread]]
id = "rassegna"
why = "le testate locali e gli enti pubblici che la lista segue, come canali delle fonti esterne del hub"
type = "source"
data_class = "public"
guide = "Ciò che altri pubblicano sul comune e sulla campagna: leggilo attraverso le schede del hub, cita testata e data."

[[suggested_thread]]
id = "social"
why = "gli account social della lista: l'agente redige i post, una persona li pubblica"
type = "connector"
data_class = "org"
guide = "Gli account della lista: leggi i post pubblicati; solo bozze, pubblica una persona; mai i dati dei follower."
