# Il seed del pacchetto dello studio di progettazione nel hub (core: texo seed, route admin/seed). Ogni voce ha un
# code o una key stabile: una nuova versione del seed aggiorna ciò che un lead non ha cambiato e tiene ciò che un
# lead ha cambiato.
lang = "it_IT"

[[activities]]
code = "design"
name = "Progettazione"
sequence = 30
description = "Progettazione a ogni livello: fattibilità, progetto definitivo ed esecutivo, calcoli, elaborati, relazioni."

[[activities]]
code = "site"
name = "Direzione lavori e sicurezza"
sequence = 40
description = "Direzione dei lavori, contabilità di cantiere, coordinamento della sicurezza in progettazione ed esecuzione, collaudo."

[[activities]]
code = "tender"
name = "Gare e offerte"
sequence = 50
description = "Gare pubbliche e offerte private: requisiti, documenti, corrispettivi, offerta tecnica."

[[activities]]
code = "bim"
name = "Gestione informativa (BIM)"
sequence = 60
description = "Modelli, capitolato informativo, il piano di gestione informativa, l'ambiente di condivisione dei dati."

[[rules]]
key = "the_professional_signs"
name = "Il professionista firma e invia"
severity = "never"
activities = ["design", "site", "tender", "communication"]
section = "compliance"
keywords = "firma, timbro, invio, PEC, deposito, sign, stamp, send"
body = "Non firmare, timbrare, depositare o inviare mai un documento a un ente pubblico, a un committente o a un'impresa: l'agente lo prepara, il professionista responsabile lo controlla, lo firma e lo invia."

[[rules]]
key = "calculations_checked"
name = "Calcoli e giudizi sulla sicurezza sono proposte"
severity = "must"
activities = ["design", "site"]
section = "operations"
keywords = "calcolo, verifica, strutture, sicurezza, calculation, check"
body = "Un calcolo, una verifica strutturale o energetica e un giudizio sulla sicurezza scritti dall'agente sono proposte: il professionista responsabile li verifica prima che entrino in un elaborato, in una relazione o in una decisione."

[[rules]]
key = "cite_the_standard"
name = "Cita la norma letta"
severity = "must"
activities = ["design", "site", "tender"]
section = "operations"
keywords = "norma, articolo, decreto, codice, norma tecnica, citazione, standard, citation"
body = "Un requisito preso da un codice, un decreto o una norma tecnica si cita con atto, articolo e il giorno in cui si è letto il testo vigente; una regola ricordata a memoria non è una fonte."

[[rules]]
key = "documents_stay_in_the_archive"
name = "I documenti restano nell'archivio"
severity = "must"
activities = ["design", "bim", "site"]
section = "operations"
keywords = "archivio, CDE, ACDat, modello, elaborato, revisione"
body = "Modelli, elaborati e relazioni restano nell'archivio o nell'ambiente di condivisione dei dati dello studio: la memoria tiene il loro riferimento (contenitore, revisione, stato) e i fatti e le decisioni presi da essi, mai una copia."

[[rules]]
key = "ai_register"
name = "Output dell'AI registrato nella commessa"
severity = "must"
activities = ["design", "site", "tender", "bim", "communication"]
section = "compliance"
keywords = "registro AI, intelligenza artificiale, L. 132/2025, trasparenza, AI register"
body = "Ogni output di un sistema di AI che arriva in un elaborato, un calcolo, uno script o una comunicazione fuori dallo studio si registra nel registro AI della commessa, con chi l'ha verificato: l'opera intellettuale resta del professionista e il committente è informato."

[[rules]]
key = "client_data_in_the_hub"
name = "Dati di committenti e cantiere solo nel hub"
severity = "never"
activities = []
section = "compliance"
keywords = "dati personali, committente, cantiere, indirizzo, impresa, privacy"
body = "Non scrivere mai i dati personali dei committenti privati, delle persone in cantiere o delle persone di un'impresa in file della cartella di lavoro: stanno nel hub, sul record della commessa, e solo quanto serve alla commessa."

[[project_templates]]
key = "commission"
name = "Commessa (template)"
description = "<p>Le fasi di una commessa, dall'offerta alla chiusura; togli quelle che l'incarico non comprende.</p>"
tasks = [
    {name = "Offerta e incarico", description = "<p>Oggetto, corrispettivo, scadenze, l'informativa al committente sull'uso dell'AI.</p>"},
    {name = "Progetto di fattibilità", description = "<p>Rilievo, vincoli, alternative, la fattibilità tecnica ed economica.</p>"},
    {name = "Progetto definitivo ed esecutivo", description = "<p>Elaborati, calcoli, capitolati, computo, piano di sicurezza.</p>"},
    {name = "Titoli abilitativi", description = "<p>I titoli edilizi, sismici, paesaggistici e antincendio che servono ai lavori.</p>"},
    {name = "Direzione dei lavori", description = "<p>Consegna dei lavori, contabilità di cantiere, ordini di servizio, varianti, coordinamento della sicurezza.</p>"},
    {name = "Collaudo e chiusura", description = "<p>Collaudo, certificati, i documenti as-built, la chiusura della commessa.</p>"},
]

[[project_templates]]
key = "public_tender"
name = "Gara pubblica (template)"
description = "<p>La partecipazione a una gara per servizi di ingegneria e architettura.</p>"
tasks = [
    {name = "Partecipare o no", description = "<p>Requisiti, corrispettivo, carico di lavoro, partner: la decisione di partecipare.</p>"},
    {name = "Raggruppamento e requisiti", description = "<p>Il raggruppamento di professionisti, l'impegno, le dichiarazioni.</p>"},
    {name = "Offerta tecnica", description = "<p>Relazioni, referenze, l'offerta di gestione informativa quando richiesta.</p>"},
    {name = "Offerta economica"},
    {name = "Presentazione e seguito", description = "<p>Presentazione sulla piattaforma, richieste di chiarimento, l'esito.</p>"},
]
