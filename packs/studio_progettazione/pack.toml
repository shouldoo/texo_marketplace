# Il contratto di questo pacchetto con la CLI texo (texo/packs.py del core).
[pack]
name = "studio_progettazione"
version = "v1.2.0"
core = ">=2.0, <3"
hub = ">=20.0.1.0.0"
work_dirs = []

# I tipi di filo che uno studio monta: texo mount dice quali mancano. Il cliente dichiara ciascuno nella lista
# [[thread]] dei fili del hub con il driver, l'indirizzo e il ref che sceglie.
[[suggested_thread]]
id = "normativa"
why = "i codici, i decreti e le norme tecniche che lo studio applica, letti e citati, mai riportati a memoria"
type = "source"
data_class = "public"
guide = "Codici, decreti, norme tecniche: cerca, leggi l'articolo vigente, cita atto, articolo e data di lettura."

[[suggested_thread]]
id = "progettazione"
why = "il software di progettazione e BIM o l'ambiente di condivisione dei dati dello studio, attraverso un adattatore in threads/<id>/"
type = "connector"
data_class = "customer"
writes = "confirm"
guide = "Modelli e contenitori delle commesse: leggi revisione e stato; non modificare mai un modello senza la persona."

[[suggested_thread]]
id = "documenti"
why = "l'archivio delle commesse: elaborati, relazioni, contratti, verbali"
type = "connector"
data_class = "customer"
writes = "confirm"
guide = "Documenti delle commesse: leggili, non copiarli mai in locale; registra nel hub la scheda di un documento."
